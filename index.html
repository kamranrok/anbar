<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدیریت انبار</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5b5bf0">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="انبار">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f1f4fb;--card:#fff;--tx:#1e2340;--mut:#7a809c;--pri:#5b5bf0;--ok:#16a870;--warn:#f59e0b;--bad:#ef4444;--info:#0ea5e9}
*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--tx)}
button{font-family:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 16px;font-weight:600;color:#fff;background:var(--pri)}
button.sec{background:#e5e8f6;color:var(--tx)}
input,select{font-family:inherit;padding:9px 12px;border:1.5px solid #dde1f2;border-radius:10px;font-size:14px;background:#fff}
.hide{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#5b5bf0,#a855f7 55%,#ec4899)}
.lbox{background:#fff;padding:36px;border-radius:22px;width:340px;box-shadow:0 20px 60px #0004;display:grid;gap:14px;text-align:center}
.lbox h1{margin:0;font-size:24px}
header{background:linear-gradient(90deg,#5b5bf0,#a855f7);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h2{margin:0;font-size:20px}
header button{background:#fff3;padding:7px 14px}
nav{display:flex;gap:8px;padding:16px 24px 0}
nav button{background:#fff;color:var(--mut);box-shadow:0 2px 8px #0001}
nav button.on{background:var(--pri);color:#fff}
main{padding:16px 24px 40px;max-width:1200px;margin:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.st{background:var(--card);border-radius:16px;padding:16px 18px;border-right:6px solid var(--c);box-shadow:0 3px 12px #0001;cursor:pointer}
.st b{display:block;font-size:28px;color:var(--c)}.st span{color:var(--mut);font-size:13px}
.alarm{background:#fff1f1;border:1.5px solid #fecaca;color:#b91c1c;padding:12px 16px;border-radius:12px;margin-bottom:14px;font-weight:600}
.bar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.bar input{flex:1;min-width:200px}
.tw{background:var(--card);border-radius:16px;box-shadow:0 3px 12px #0001;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#eef0fb;padding:11px 12px;text-align:right;white-space:nowrap;position:sticky;top:0}
td{padding:10px 12px;border-top:1px solid #eef0f8}
tr:hover td{background:#fafbff}
.tag{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
.in{color:var(--ok);font-weight:600}.out{color:var(--bad);font-weight:600}
td input{width:80px;padding:5px 8px}
.drop{background:var(--card);border:3px dashed #b9bff0;border-radius:20px;padding:40px;text-align:center;margin-bottom:16px}
.drop p{color:var(--mut)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e2340;color:#fff;padding:12px 22px;border-radius:12px;z-index:9}
.err{color:var(--bad);font-size:13px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.fg label{display:grid;gap:4px;font-size:13px;color:var(--mut)}.call{color:var(--info);font-weight:700;text-decoration:none;direction:ltr;display:inline-block}
.stk{max-height:72vh}
th{z-index:2}
.mt{display:flex;align-items:center;gap:8px;min-width:150px}
.trk{flex:1;min-width:80px;height:14px;border-radius:7px;background:#e6e9f5;overflow:hidden;box-shadow:inset 0 1px 3px #0002}
.fl{height:100%;border-radius:7px;transition:width .6s;background-image:repeating-linear-gradient(135deg,#ffffff40 0 6px,#ffffff00 6px 12px)}
.mt span{font-size:12px;font-weight:600;white-space:nowrap;min-width:52px}
.u{display:none}
html{-webkit-text-size-adjust:100%}
@media(max-width:640px){
  body{font-size:13px}
  header{padding:10px 14px}header h2{font-size:16px}header button{padding:5px 10px;font-size:12px}
  nav{padding:10px 10px 0;gap:6px;overflow-x:auto;flex-wrap:nowrap}
  nav button{white-space:nowrap;padding:7px 12px;font-size:12px}
  main{padding:10px 10px 30px}
  .stats{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .st{padding:8px 12px;border-right-width:5px;border-radius:12px}
  .st b{font-size:20px}.st span{font-size:11px}
  .alarm{padding:8px 12px;font-size:12px;margin-bottom:10px}
  .bar{gap:8px}.bar input{min-width:100%;padding:8px 10px}.bar select{flex:1;padding:8px}.bar button{padding:8px 12px;font-size:12px}
  .fg{grid-template-columns:1fr 1fr;gap:8px}
  .lbox{width:92%;padding:26px}
  .tw table{font-size:12px}.tw th,.tw td{padding:7px 8px}
  .stk{max-height:none;background:transparent;box-shadow:none;overflow:visible}
  .stk table,.stk tbody{display:block}.stk thead{display:none}
  .stk tr{display:grid;grid-template-columns:1fr auto auto;grid-template-areas:"t t q" "c i o" "m m m";gap:4px 10px;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:0 2px 8px #0001}
  .stk td{border:0;padding:0}
  .stk td.c-title{grid-area:t;font-size:13px}
  .stk td.c-qty{grid-area:q;text-align:left;white-space:nowrap}
  .stk td.c-qty b{font-size:16px!important}.u{display:inline;color:var(--mut)}
  .stk td.c-code{grid-area:c;color:var(--mut);font-size:11px}
  .stk td.c-in{grid-area:i;font-size:11px}.stk td.c-in::before{content:"ورودی ";color:var(--mut);font-weight:400}
  .stk td.c-out{grid-area:o;font-size:11px}.stk td.c-out::before{content:"خروجی ";color:var(--mut);font-weight:400}
  .stk td.c-st{grid-area:m}.stk .mt{min-width:0}
  .stk td.c-unit,.stk td.c-min{display:none}
  .stk td[colspan]{grid-column:1/-1}
  .drop{padding:20px}
}
</style>
</head>
<body>

<!-- ورود -->
<div id="login">
  <div class="lbox">
    <div style="font-size:46px">📦</div>
    <h1>مدیریت انبار</h1>
    <input id="u" placeholder="نام کاربری" autocomplete="username" dir="ltr">
    <input id="p" type="password" placeholder="رمز عبور" autocomplete="current-password" dir="ltr" onkeydown="if(event.key=='Enter')doLogin()">
    <button onclick="doLogin()">ورود</button>
    <div id="lerr" class="err"></div>
  </div>
</div>

<!-- اپ -->
<div id="app" class="hide">
  <header><h2>📦 مدیریت انبار</h2><div>👤 <span id="who"></span> <button id="instbtn" class="hide" onclick="installApp()">📲 نصب اپ</button> <button onclick="logout()">خروج</button></div></header>
  <nav>
    <button id="t-stock" class="on" onclick="tab('stock')">موجودی کالاها</button>
    <button id="t-hist" onclick="tab('hist')">تاریخچه ورود و خروج</button>
    <button id="t-imp" onclick="tab('imp')">ایمپورت اکسل</button>
  </nav>
  <main>
    <section id="stock">
      <div class="stats" id="stats"></div>
      <div id="alarm"></div>
      <div class="bar">
        <input id="q" placeholder="جستجوی نام یا کد کالا…" oninput="renderStock()">
        <select id="f" onchange="renderStock()">
          <option value="all">همه کالاها</option><option value="low">فقط کم‌موجود</option><option value="zero">فقط تمام‌شده</option>
        </select>
        <button id="addbtn" class="hide" onclick="openItem(-1)">➕ کالای جدید</button>
      </div>
      <div class="tw stk"><table><thead><tr><th>کد</th><th>عنوان</th><th>واحد</th><th>کل ورودی</th><th>کل خروجی</th><th>موجودی</th><th>حد هشدار</th><th>وضعیت</th></tr></thead><tbody id="rows"></tbody></table></div>
    </section>

    <section id="hist" class="hide">
      <div class="tw"><table><thead><tr><th>تاریخ</th><th>کد</th><th>عنوان</th><th>رسید (+)</th><th>کسر (−)</th><th>موجودی جدید</th><th>منبع</th><th>کاربر</th></tr></thead><tbody id="hrows"></tbody></table></div>
    </section>

    <section id="item" class="hide"><p><button class="sec" onclick="tab('stock')">← بازگشت به لیست</button></p><div id="itemBox"></div></section>

    <section id="imp" class="hide">
      <div class="drop">
        <div style="font-size:42px">📥</div>
        <h3>فایل اکسل برنامه حسابداری را انتخاب کنید</h3>
        <p>ستون‌ها: کد کالا، عنوان کالا، مشخصات کالا، ورودی، خروجی، موجودی، واحد اصلی</p>
        <input type="file" id="file" accept=".xlsx,.xls" onchange="readFile(this.files[0])">
      </div>
      <div id="preview"></div>
    </section>
  </main>
</div>
<div id="toast" class="hide"></div>

<script>
// ===== تنظیمات Supabase: این دو مقدار را از Project Settings > API کپی کنید =====
const SUPABASE_URL = "https://phcdhmrrnzfolsvwcjiw.supabase.co";
const SUPABASE_KEY = "sb_publishable_vpfw_BcZiITj011wU8zCxA_ja4iNTA0";
// ================================================================================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const DOMAIN = "@anbar.app";
let items = [], user = "", pending = [], isAdmin = false, cur = null;
const ADMIN = "co.ajgostar@gmail.com";
const IMPORTERS = [ADMIN, "anbar.mayan@gmail.com", "anbar@anbar.app"];

const $ = id => document.getElementById(id);
const fa = s => String(s ?? "").replace(/ك/g,"ک").replace(/ي/g,"ی").trim();
const num = v => { const n = parseFloat(String(v ?? 0).replace(/,/g,"")); return isNaN(n) ? 0 : n; };
const fmt = n => (Math.round(n*1000)/1000).toLocaleString("fa-IR");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("toast");t.textContent=m;t.classList.remove("hide");setTimeout(()=>t.classList.add("hide"),3500)}

async function doLogin(){
  $("lerr").textContent="";
  let em=$("u").value.trim().toLowerCase();if(!em.includes("@"))em+=DOMAIN;
  const {error}=await sb.auth.signInWithPassword({email:em,password:$("p").value});
  if(error){$("lerr").textContent="نام کاربری یا رمز عبور اشتباه است";return}
  start();
}
async function logout(){await sb.auth.signOut();location.reload()}
async function start(){
  const {data}=await sb.auth.getSession();
  if(!data.session)return;
  user=data.session.user.email.replace(DOMAIN,"");isAdmin=data.session.user.email.toLowerCase()==ADMIN;$("t-imp").classList.toggle("hide",!IMPORTERS.includes(data.session.user.email.toLowerCase()));
  $("who").textContent=user+(isAdmin?" (مدیر)":"");$("addbtn").classList.toggle("hide",!isAdmin);
  $("login").classList.add("hide");$("app").classList.remove("hide");
  await loadItems();
}
function tab(t){
  ["stock","hist","imp","item"].forEach(x=>{$(x).classList.toggle("hide",x!=t);const b=$("t-"+x);if(b)b.classList.toggle("on",x==t)});
  if(t=="hist")loadHist();
}

async function loadItems(){
  const {data,error}=await sb.from("items").select("*").order("title").limit(5000);
  if(error){toast("خطا در دریافت اطلاعات");return}
  items=data;renderStock();
}
const status=i=>i.qty<=0?"zero":(i.min_qty>0&&i.qty<=i.min_qty?"low":"ok");

function meter(i){
  const ref=i.min_qty>0?i.min_qty*3:(i.total_in>0?i.total_in:Math.max(i.qty,1));
  const r=Math.max(0,Math.min(1,i.qty/ref)),pc=Math.round(r*100),s=status(i);
  const c=s=="zero"||r<0.2?"#ef4444":r<0.5?"#f59e0b":"#16a870";
  const t=s=="zero"?"تمام شد":s=="low"?"کم‌موجود":"موجود";
  return `<div class="mt" title="${pc.toLocaleString("fa-IR")}٪ باقی‌مانده"><div class="trk"><div class="fl" style="width:${pc}%;background-color:${c}"></div></div><span style="color:${c}">${t}</span></div>`;
}
function renderStock(){
  const z=items.filter(i=>status(i)=="zero"),l=items.filter(i=>status(i)=="low");
  $("stats").innerHTML=[["همه کالاها",items.length,"#5b5bf0","all"],["موجود و سالم",items.length-z.length-l.length,"#16a870","all"],["کم‌موجود",l.length,"#f59e0b","low"],["تمام‌شده",z.length,"#ef4444","zero"]]
    .map(s=>`<div class="st" style="--c:${s[2]}" onclick="$('f').value='${s[3]}';renderStock()"><b>${fmt(s[1])}</b><span>${s[0]}</span></div>`).join("");
  $("alarm").innerHTML=(z.length+l.length)?`<div class="alarm">🔔 هشدار: ${fmt(z.length)} کالا تمام شده و ${fmt(l.length)} کالا به حد هشدار رسیده است.</div>`:"";
  const q=fa($("q").value).toLowerCase(),f=$("f").value;
  const list=items.filter(i=>(f=="all"||(f=="zero"?status(i)=="zero":status(i)=="low"||(f=="low"&&0)))&&(!q||(i.title+i.code).toLowerCase().includes(q)));
  
  $("rows").innerHTML=list.map(i=>{const s=status(i);return `<tr style="cursor:pointer" onclick="openItem(${items.indexOf(i)})">
    <td class="c-code" dir="ltr" style="text-align:right">${esc(i.code)}</td><td class="c-title"><b>${esc(i.title)}</b><div style="color:var(--mut);font-size:12px">${esc(i.spec)}</div></td>
    <td class="c-unit">${esc(i.unit)}</td><td class="in c-in">${fmt(i.total_in)}</td><td class="out c-out">${fmt(i.total_out)}</td>
    <td class="c-qty"><b style="font-size:16px">${fmt(i.qty)}</b><small class="u"> ${esc(i.unit)}</small></td>
    <td class="c-min" onclick="event.stopPropagation()">${isAdmin?`<input type="number" min="0" value="${i.min_qty||0}" onchange="setMin('${esc(i.code).replace(/'/g,"\\'")}',this.value)">`:fmt(i.min_qty||0)}</td>
    <td class="c-st">${meter(i)}</td></tr>`}).join("")||`<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--mut)">موردی یافت نشد</td></tr>`;
}
async function setMin(code,v){
  const {error}=await sb.from("items").update({min_qty:num(v)}).eq("code",code);
  if(error)return toast("ذخیره نشد");
  items.find(i=>i.code==code).min_qty=num(v);renderStock();toast("حد هشدار ذخیره شد");
}

async function loadHist(){
  const {data}=await sb.from("movements").select("*").order("id",{ascending:false}).limit(300);
  $("hrows").innerHTML=(data||[]).map(m=>`<tr><td>${new Date(m.created_at).toLocaleString("fa-IR")}</td><td dir="ltr" style="text-align:right">${esc(m.code)}</td><td>${esc(m.title)}</td>
   <td class="in">${m.in_qty?"+"+fmt(m.in_qty):"—"}</td><td class="out">${m.out_qty?"−"+fmt(m.out_qty):"—"}</td><td><b>${fmt(m.qty_after)}</b> ${esc(m.unit)}</td><td>${({init:"اولین ورود",manual:"ویرایش دستی"})[m.kind]||"اکسل"}</td><td>${esc(m.user_name)}</td></tr>`).join("")
   ||`<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--mut)">تاریخچه‌ای ثبت نشده</td></tr>`;
}

function readFile(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:"array"});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
    const get=(row,name)=>{const k=Object.keys(row).find(k=>fa(k)==name);return k?row[k]:""};
    const map=new Map(items.map(i=>[i.code,i]));
    pending=[];let same=0;
    rows.forEach(row=>{
      const code=fa(get(row,"کد کالا"));if(!code)return;
      const n={code,title:fa(get(row,"عنوان کالا")),spec:fa(get(row,"مشخصات کالا")),unit:fa(get(row,"واحد اصلی")),
        total_in:Math.abs(num(get(row,"ورودی"))),total_out:Math.abs(num(get(row,"خروجی"))),qty:num(get(row,"موجودی"))};
      const o=map.get(code);
      if(!o){pending.push({n,in_q:n.qty>0?n.qty:0,out_q:0,isNew:true});return}
      let di=Math.max(n.total_in-o.total_in,0),dout=Math.max(n.total_out-o.total_out,0);
      const dq=n.qty-o.qty;
      if(!di&&!dout&&dq){dq>0?di=dq:dout=-dq}
      if(di||dout||dq)pending.push({n,in_q:di,out_q:dout,o});else same++;
    });
    $("preview").innerHTML=`<div class="stats">
      <div class="st" style="--c:#5b5bf0"><b>${fmt(rows.length)}</b><span>ردیف در فایل</span></div>
      <div class="st" style="--c:#0ea5e9"><b>${fmt(pending.filter(p=>p.isNew).length)}</b><span>کالای جدید</span></div>
      <div class="st" style="--c:#f59e0b"><b>${fmt(pending.filter(p=>!p.isNew).length)}</b><span>کالای تغییرکرده</span></div>
      <div class="st" style="--c:#7a809c"><b>${fmt(same)}</b><span>بدون تغییر</span></div></div>
      ${pending.length?`<div class="tw"><table><thead><tr><th>کد</th><th>عنوان</th><th>رسید</th><th>کسر</th><th>موجودی قبلی</th><th>موجودی جدید</th></tr></thead><tbody>${pending.map(p=>`<tr><td dir="ltr" style="text-align:right">${esc(p.n.code)}</td><td>${esc(p.n.title)} ${p.isNew?'<span class="tag" style="background:#0ea5e9">جدید</span>':''}</td><td class="in">${p.in_q?"+"+fmt(p.in_q):"—"}</td><td class="out">${p.out_q?"−"+fmt(p.out_q):"—"}</td><td>${p.o?fmt(p.o.qty):"—"}</td><td><b>${fmt(p.n.qty)}</b> ${esc(p.n.unit)}</td></tr>`).join("")}</tbody></table></div>
      <p><button onclick="applyImport()">✅ تایید و اعمال تغییرات</button></p>`:`<p>تغییری نسبت به موجودی فعلی وجود ندارد.</p>`}`;
  };
  r.readAsArrayBuffer(file);
}

async function applyImport(){
  const rows=pending.map(p=>({...p.n,in_q:p.in_q,out_q:p.out_q,is_new:!!p.isNew}));
  for(let i=0;i<rows.length;i+=200){
    const {error}=await sb.rpc("import_items",{rows:rows.slice(i,i+200)});
    if(error){toast("خطا: "+error.message);return}
  }
  pending=[];$("preview").innerHTML="";$("file").value="";
  await loadItems();tab("stock");toast("موجودی انبار به‌روزرسانی شد ✔");
}

// ===== صفحه کالا =====
async function openItem(idx){
  cur=idx>=0?items[idx]:null;tab("item");
  const i=cur||{code:"",title:"",spec:"",unit:"",qty:0,min_qty:0},ro=isAdmin?"":"disabled";
  let h=`<div class="tw" style="padding:20px;margin-bottom:16px"><h3 style="margin-top:0">${cur?esc(i.title):"کالای جدید"}</h3><div class="fg">
   <label>کد کالا<input id="f_code" ${cur?"disabled":ro} value="${esc(i.code)}"></label>
   <label>عنوان<input id="f_title" ${ro} value="${esc(i.title)}"></label>
   <label>مشخصات<input id="f_spec" ${ro} value="${esc(i.spec)}"></label>
   <label>واحد<input id="f_unit" ${ro} value="${esc(i.unit)}"></label>
   <label>موجودی<input id="f_qty" type="number" step="any" ${ro} value="${i.qty}"></label>
   <label>حد هشدار<input id="f_min" type="number" step="any" ${ro} value="${i.min_qty||0}"></label></div>
   ${isAdmin?`<p><button onclick="saveItem()">💾 ذخیره</button> ${cur?`<button style="background:var(--bad)" onclick="delItem()">🗑 حذف کالا</button>`:""}</p>`:""}</div>`;
  if(cur)h+=`<div id="pur"></div><h3>تاریخچه ورود و خروج این کالا</h3><div class="tw"><table><thead><tr><th>تاریخ</th><th>رسید</th><th>کسر</th><th>موجودی</th><th>منبع</th><th>کاربر</th></tr></thead><tbody id="ihist"></tbody></table></div>`;
  $("itemBox").innerHTML=h;
  if(cur){loadItemHist();if(isAdmin)loadPurchases()}
}
async function saveItem(){
  const code=fa($("f_code").value),title=fa($("f_title").value);
  if(!code||!title)return toast("کد و عنوان الزامی است");
  if(!cur&&items.some(x=>x.code==code))return toast("این کد قبلاً ثبت شده است");
  const qty=num($("f_qty").value),old=cur?cur.qty:0;
  const row={code,title,spec:fa($("f_spec").value),unit:fa($("f_unit").value),qty,min_qty:num($("f_min").value),updated_at:new Date().toISOString()};
  const {error}=cur?await sb.from("items").update(row).eq("code",code):await sb.from("items").insert(row);
  if(error)return toast("ذخیره نشد: "+error.message);
  if(qty!=old)await sb.from("movements").insert({code,title,unit:row.unit,in_qty:qty>old?qty-old:0,out_qty:qty<old?old-qty:0,qty_after:qty,kind:cur?"manual":"init",user_name:user});
  await loadItems();tab("stock");toast("ذخیره شد ✔");
}
async function delItem(){
  if(!confirm("این کالا و خریدهای ثبت‌شده‌اش حذف شود؟"))return;
  await sb.from("purchases").delete().eq("code",cur.code);await sb.from("sellers").delete().eq("code",cur.code);
  const {error}=await sb.from("items").delete().eq("code",cur.code);
  if(error)return toast("حذف نشد");
  await loadItems();tab("stock");toast("کالا حذف شد");
}
async function loadItemHist(){
  const {data}=await sb.from("movements").select("*").eq("code",cur.code).order("id",{ascending:false}).limit(100);
  $("ihist").innerHTML=(data||[]).map(m=>`<tr><td>${new Date(m.created_at).toLocaleString("fa-IR")}</td><td class="in">${m.in_qty?"+"+fmt(m.in_qty):"—"}</td><td class="out">${m.out_qty?"−"+fmt(m.out_qty):"—"}</td><td><b>${fmt(m.qty_after)}</b></td><td>${({init:"اولین ورود",manual:"ویرایش دستی"})[m.kind]||"اکسل"}</td><td>${esc(m.user_name)}</td></tr>`).join("")||`<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--mut)">سابقه‌ای نیست</td></tr>`;
}
const JM=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
function j2g(jy,jm,jd){
  jy+=1595;let days=-355668+(365*jy)+(~~(jy/33))*8+~~(((jy%33)+3)/4)+jd+((jm<7)?(jm-1)*31:((jm-7)*30)+186);
  let gy=400*~~(days/146097);days%=146097;
  if(days>36524){gy+=100*~~(--days/36524);days%=36524;if(days>=365)days++}
  gy+=4*~~(days/1461);days%=1461;
  if(days>365){gy+=~~((days-1)/365);days=(days-1)%365}
  let gd=days+1;const sal=[0,31,((gy%4==0&&gy%100!=0)||(gy%400==0))?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm;for(gm=0;gm<13&&gd>sal[gm];gm++)gd-=sal[gm];
  return [gy,gm,gd];
}
function g2j(gy,gm,gd){
  const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];let gy2=(gm>2)?(gy+1):gy;
  let days=355666+(365*gy)+~~((gy2+3)/4)-~~((gy2+99)/100)+~~((gy2+399)/400)+gd+gdm[gm-1];
  let jy=-1595+(33*~~(days/12053));days%=12053;jy+=4*~~(days/1461);days%=1461;
  if(days>365){jy+=~~((days-1)/365);days=(days-1)%365}
  const jm=(days<186)?1+~~(days/31):7+~~((days-186)/30),jd=1+((days<186)?(days%31):((days-186)%30));
  return [jy,jm,jd];
}
function jdate(id){
  const t=new Date(),[jy,jm,jd]=g2j(t.getFullYear(),t.getMonth()+1,t.getDate());
  const o=(x,y,sel,f)=>{let h="";for(let v=x;v<=y;v++)h+=`<option value="${v}" ${v==sel?"selected":""}>${f?f(v):v.toLocaleString("fa-IR",{useGrouping:false})}</option>`;return h};
  $(id).innerHTML=`<select>${o(1,31,jd)}</select> <select>${o(1,12,jm,v=>JM[v-1])}</select> <select>${o(jy-6,jy+1,jy)}</select>`;
}
function jval(id){
  let [d,m,y]=[...$(id).querySelectorAll("select")].map(x=>+x.value);
  d=Math.min(d,m<=6?31:(m==12?29:30));const [gy,gm,gd]=j2g(y,m,d);
  return `${gy}-${String(gm).padStart(2,"0")}-${String(gd).padStart(2,"0")}`;
}
const callLink=ph=>ph?`<a class="call" href="tel:${esc(ph.replace(/[^\d+]/g,""))}">📞 ${esc(ph)}</a>`:"—";
async function loadPurchases(){
  const [pr,sl]=await Promise.all([
    sb.from("purchases").select("*").eq("code",cur.code).order("buy_date",{ascending:false}),
    sb.from("sellers").select("*").eq("code",cur.code).order("id")]);
  if(sl.error)toast("جدول فروشندگان ساخته نشده؛ update2.sql را اجرا کنید");
  const data=pr.data||[],sellers=sl.data||[];cur._sellers=sellers;
  const emp=t=>`<tr><td colspan="8" style="text-align:center;padding:20px;color:var(--mut)">${t}</td></tr>`;
  $("pur").innerHTML=`<h3>👥 فروشندگان این کالا</h3><div class="tw" style="padding:16px;margin-bottom:16px"><div class="fg">
   <label>نام فروشنده<input id="s_name"></label>
   <label>موبایل<input id="s_phone" dir="ltr" inputmode="tel" placeholder="09123456789"></label>
   <label>توضیح<input id="s_note"></label></div>
   <p><button onclick="addSeller()">➕ افزودن فروشنده</button></p>
   <table><tbody>${sellers.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${callLink(x.phone)}</td><td>${esc(x.note)}</td><td><button class="sec" onclick="delSeller(${x.id})">حذف</button></td></tr>`).join("")||emp("هنوز فروشنده‌ای ثبت نشده")}</tbody></table></div>
   <h3>🛒 ثبت خرید <span style="font-size:12px;color:var(--mut);font-weight:400">(روی موجودی اثری ندارد)</span></h3><div class="tw" style="padding:16px;margin-bottom:12px"><div class="fg">
   <div style="display:grid;gap:4px;font-size:13px;color:var(--mut)">تاریخ خرید<div id="p_date"></div></div>
   <label>تعداد<input id="p_qty" type="number" step="any"></label>
   <label>قیمت واحد<input id="p_price" type="number" step="any"></label>
   <label>فروشنده<select id="p_sel" onchange="$('p_other').classList.toggle('hide',this.value!=='')">${sellers.map((x,i)=>`<option value="${i}">${esc(x.name)}</option>`).join("")}<option value="">فروشنده دیگر…</option></select></label>
   <label>توضیح<input id="p_note"></label>
   <div id="p_other" class="fg ${sellers.length?"hide":""}" style="grid-column:1/-1"><label>نام فروشنده<input id="p_name"></label><label>موبایل<input id="p_phone" dir="ltr" inputmode="tel"></label></div></div>
   <p><button onclick="addPurchase()">➕ ثبت خرید</button></p></div>
   <div class="tw"><table><thead><tr><th>تاریخ</th><th>تعداد</th><th>قیمت واحد</th><th>جمع</th><th>فروشنده</th><th>تماس</th><th>توضیح</th><th></th></tr></thead><tbody>${data.map(r=>`<tr><td>${r.buy_date?new Date(r.buy_date).toLocaleDateString("fa-IR-u-ca-persian"):"—"}</td><td>${fmt(r.qty||0)}</td><td>${fmt(r.price||0)}</td><td><b>${fmt((r.qty||0)*(r.price||0))}</b></td><td>${esc(r.seller_name)}</td><td>${callLink(r.seller_phone)}</td><td>${esc(r.note)}</td><td><button class="sec" onclick="delPurchase(${r.id})">حذف</button></td></tr>`).join("")||emp("خریدی ثبت نشده")}</tbody></table></div>`;
  jdate("p_date");
}
async function addSeller(){
  const name=$("s_name").value.trim();if(!name)return toast("نام فروشنده را بنویسید");
  const {error}=await sb.from("sellers").insert({code:cur.code,name,phone:$("s_phone").value.trim(),note:$("s_note").value.trim()});
  if(error)return toast("ثبت نشد: "+error.message);
  toast("فروشنده اضافه شد ✔");loadPurchases();
}
async function delSeller(id){
  if(!confirm("این فروشنده حذف شود؟"))return;
  await sb.from("sellers").delete().eq("id",id);loadPurchases();
}
async function addPurchase(){
  const sv=$("p_sel").value;let name,phone;
  if(sv!==""){const x=cur._sellers[+sv];name=x.name;phone=x.phone}else{name=$("p_name").value.trim();phone=$("p_phone").value.trim()}
  const {error}=await sb.from("purchases").insert({code:cur.code,buy_date:jval("p_date"),qty:num($("p_qty").value),price:num($("p_price").value),seller_name:name,seller_phone:phone,note:$("p_note").value.trim(),created_by:user});
  if(error)return toast("ثبت نشد: "+error.message);
  toast("خرید ثبت شد ✔");loadPurchases();
}
async function delPurchase(id){
  if(!confirm("این ردیف حذف شود؟"))return;
  await sb.from("purchases").delete().eq("id",id);loadPurchases();
}
